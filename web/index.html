<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CachePot — a no-loss prize savings pool where every balance stays encrypted on Zama's FHEVM. Anyone can audit the draw; nobody can read the ledger."
    />

    <!-- social cards; og:image must stay an absolute URL of the deployed site -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CachePot — Confidential Prize Savings" />
    <meta
      property="og:description"
      content="A no-loss lottery on Zama FHEVM: encrypted balances, encrypted winners, publicly auditable draws. Principal custodied on Zama Earn."
    />
    <meta property="og:image" content="https://cachepot.vercel.app/brand/cachepot-concealed-vault.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CachePot — Confidential Prize Savings" />
    <meta
      name="twitter:description"
      content="A no-loss lottery on Zama FHEVM: encrypted balances, encrypted winners, publicly auditable draws."
    />
    <meta name="twitter:image" content="https://cachepot.vercel.app/brand/cachepot-concealed-vault.png" />
    <script>
      // paint the stored theme before first paint; light is the default
      try {
        if (localStorage.theme === "dark") document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
